<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071013"/>
      <stop offset="1" stop-color="#12352e"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16352f"/>
      <stop offset="1" stop-color="#0d1b1d"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#61d6b1"/>
    </marker>
    <style>
      .title{font:700 30px Arial;fill:#e7fff6}.subtitle{font:14px Arial;fill:#8fb5aa}
      .head{font:700 16px Arial;fill:#cffff0}.text{font:13px Arial;fill:#9dbab2}
      .small{font:12px Arial;fill:#79a49a}.box{fill:url(#box);stroke:#2d6656;stroke-width:2;rx:14}
      .arrow{stroke:#61d6b1;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dashed{stroke:#bd9b62;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="70" y="65" class="title">NexusShield — Multi-Tenant GenAI Security Architecture</text>
  <text x="70" y="93" class="subtitle">Seven-layer edge defense, adaptive honeypot routing, and encrypted auditability</text>

  <rect x="70" y="180" width="220" height="155" class="box"/>
  <text x="95" y="220" class="head">Users &amp; Apps</text>
  <text x="95" y="250" class="text">React SaaS portal</text>
  <text x="95" y="275" class="text">External API clients</text>
  <text x="95" y="300" class="text">Admin / Developer / Auditor</text>

  <rect x="365" y="135" width="430" height="255" class="box"/>
  <text x="395" y="175" class="head">FastAPI Security Middleware</text>
  <text x="395" y="210" class="text">1  Rate limit &amp; DoS protection</text>
  <text x="395" y="237" class="text">2  PII scrubbing and redaction</text>
  <text x="395" y="264" class="text">3  Five-turn context memory</text>
  <text x="395" y="291" class="text">4  Semantic jailbreak scoring</text>
  <text x="395" y="318" class="text">5  Outbound toxicity shield</text>
  <text x="395" y="345" class="text">6  Shadow model + AI Honeypot</text>
  <text x="395" y="372" class="text">7  Feedback + encrypted persistence</text>

  <rect x="875" y="180" width="220" height="155" class="box"/>
  <text x="900" y="220" class="head">Protected LLM</text>
  <text x="900" y="250" class="text">Application chatbot</text>
  <text x="900" y="275" class="text">Local or cloud model</text>
  <text x="900" y="300" class="text">Safe response only</text>

  <rect x="1135" y="180" width="195" height="155" class="box"/>
  <text x="1160" y="220" class="head">AI Honeypot</text>
  <text x="1160" y="250" class="text">Fake AI room</text>
  <text x="1160" y="275" class="text">False safe answers</text>
  <text x="1160" y="300" class="text">Attack signatures</text>

  <path d="M290 255 H365" class="arrow"/>
  <path d="M795 255 H875" class="arrow"/>
  <path d="M795 330 H1135" class="dashed"/>

  <rect x="230" y="510" width="270" height="150" class="box"/>
  <text x="260" y="550" class="head">Tenant Data Plane</text>
  <text x="260" y="580" class="text">SQLite events and policies</text>
  <text x="260" y="607" class="text">Tenant-scoped API keys</text>
  <text x="260" y="634" class="text">JWT and bcrypt auth</text>

  <rect x="565" y="510" width="270" height="150" class="box"/>
  <text x="595" y="550" class="head">Cryptographic Layer</text>
  <text x="595" y="580" class="text">AES-256-CBC threat traces</text>
  <text x="595" y="607" class="text">SHA-256 audit chain</text>
  <text x="595" y="634" class="text">Integrity verification</text>

  <rect x="900" y="510" width="270" height="150" class="box"/>
  <text x="930" y="550" class="head">Operations Portal</text>
  <text x="930" y="580" class="text">Analytics and threat feed</text>
  <text x="930" y="607" class="text">Policy tuning and replay</text>
  <text x="930" y="634" class="text">Compliance export</text>

  <path d="M580 390 V470 H365 V510" class="arrow"/>
  <path d="M650 390 V510" class="arrow"/>
  <path d="M720 390 V470 H1035 V510" class="arrow"/>
  <text x="70" y="750" class="small">All records are filtered by tenant/user identity. Frontend visibility is reinforced by backend role enforcement.</text>
</svg>
